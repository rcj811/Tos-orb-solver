name: 模擬器全功能測試

# 手動執行：在 Android 模擬器上把自轉珠所有功能操作一遍，檢查會不會崩潰
on:
  workflow_dispatch:

jobs:
  emulator:
    name: 模擬器全功能測試
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安裝 NDK / CMake / SDK 平台
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 還原固定 debug 簽章
        run: base64 -d ci/debug.keystore.b64 > ci/debug.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 編譯 APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 開啟 KVM（模擬器硬體加速）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 在模擬器上操作所有功能
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1200x1920
          script: bash ci/emulator-test.sh app/build/outputs/apk/debug/app-debug.apk

      - name: 上傳紀錄與截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test
          path: emu-out/
          if-no-files-found: ignore
